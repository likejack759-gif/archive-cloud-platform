name: Admin controls tests
on:
  push:
    branches: [admin-hardening-test]
  pull_request:
    branches: [admin-hardening-test]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q app
      - name: Validate Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          templates = sorted(Path("app/templates").glob("*.html"))
          if not templates:
              raise SystemExit("No HTML templates found")
          for path in templates:
              env.parse(path.read_text(encoding="utf-8"))
              print(f"OK: {path}")
          PY
      - name: Validate Docker Compose configuration without starting services
        run: |
          cp .env.example .env
          cp seaweedfs-s3.json.example seaweedfs-s3.json
          python - <<'PY'
          from pathlib import Path
          env = Path(".env")
          replacements = {
              "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_BYTES": "ci-only-secret-value-not-for-production-0123456789",
              "REPLACE_WITH_STRONG_ADMIN_PASSWORD": "ci-only-admin-password-123456789",
              "REPLACE_WITH_STRONG_ALPHANUMERIC_DATABASE_PASSWORD": "ci-only-db-password-123456789",
              "REPLACE_WITH_RANDOM_S3_ACCESS_KEY": "ciaccesskey123",
              "REPLACE_WITH_RANDOM_S3_SECRET_KEY": "cisecretkey123456789",
          }
          text = env.read_text(encoding="utf-8")
          for old, new in replacements.items():
              text = text.replace(old, new)
          env.write_text(text, encoding="utf-8")
          config = Path("seaweedfs-s3.json.example").read_text(encoding="utf-8")
          config = config.replace("REPLACE_WITH_MINIO_ROOT_USER", "ciaccesskey123")
          config = config.replace("REPLACE_WITH_MINIO_ROOT_PASSWORD", "cisecretkey123456789")
          Path("seaweedfs-s3.json").write_text(config, encoding="utf-8")
          PY
          docker compose config -q
          rm -f .env seaweedfs-s3.json
      - run: python -m pytest -q
