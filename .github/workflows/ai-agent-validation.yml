name: AI Agent Branch Validation

on:
  push:
    branches: [feature/ai-repair-agent]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q app tests scripts
      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader('app/templates'))
          files = sorted(Path('app/templates').glob('*.html'))
          for path in files: env.get_template(path.name)
          print('Parsed', len(files), 'templates')
          PY
      - name: Run pytest
        env:
          SECRET_KEY: ci-only-not-production
          ADMIN_PASSWORD: ci-only-not-production
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          ADMIN_USERNAME: ci-test-admin
        run: pytest -q
      - name: Validate Compose
        env:
          SECRET_KEY: ci-compose-key
          ADMIN_PASSWORD: ci-compose-password
        run: docker compose config -q