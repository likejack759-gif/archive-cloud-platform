name: Full Validation

on:
  push:
    branches:
      - feature/integrated-resource-safety
  pull_request:
    branches:
      - ui/original-deep-space
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Python syntax compilation
        run: python -m compileall -q app tests
      - name: Template parse check
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader
          env = Environment(loader=FileSystemLoader("app/templates"))
          files = sorted(Path("app/templates").glob("*.html"))
          for path in files:
              env.get_template(path.name)
          print(f"Parsed {len(files)} templates successfully")
          PY
      - name: Pytest
        run: pytest -q
      - name: Docker Compose configuration check
        run: docker compose config -q
