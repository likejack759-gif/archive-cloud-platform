name: Preview safety tests

on:
  push:
    branches:
      - feature/integrated-resource-safety
  pull_request:
    branches:
      - ui/original-deep-space

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run tests
        env:
          SECRET_KEY: preview-test-secret
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          ADMIN_USERNAME: preview-admin
          ADMIN_PASSWORD: preview-password-not-for-production
        run: pytest -q
