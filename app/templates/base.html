<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f9ff">
<title>{% block title %}云端资源库{% endblock %}</title>
<style>
:root{color-scheme:light;--bg:#f5f8fd;--panel:#fff;--line:#dce7f5;--text:#172b4d;--muted:#70819c;--accent:#3478f6;--accent-dark:#225bd0;--good:#16835d;--bad:#c53e52;--soft:#edf4ff;--shadow:0 12px 32px rgba(43,91,158,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#e3efff 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-dark);text-decoration:none}
.wrap{width:min(1180px,100%);margin:auto;padding:20px}
header{display:flex;align-items:center;gap:18px;justify-content:space-between;border-bottom:1px solid rgba(202,219,241,.9);padding:8px 0 18px;margin-bottom:26px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;font-weight:850;font-size:20px;color:var(--text);letter-spacing:.2px}
.logo{display:grid;place-items:center;width:44px;height:44px;background:linear-gradient(145deg,#6da7ff,#3478f6);color:white;border-radius:15px;box-shadow:0 7px 18px rgba(52,120,246,.22);font-size:23px}
nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav>a{font-size:14px;font-weight:650;color:#536985;padding:8px 11px;border-radius:10px}
nav>a:hover{background:#eaf2ff;color:var(--accent)}
.muted{color:var(--muted)}
.panel{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
h1{font-size:clamp(26px,4vw,38px);line-height:1.25;letter-spacing:-.6px;margin:10px 0 12px;font-weight:850}
h2{font-size:21px;letter-spacing:-.2px;margin:0 0 14px}
h3{font-size:17px}
p{line-height:1.7}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:16px}
.resource{overflow:hidden;padding:0;transition:transform .18s ease,box-shadow .18s ease}
.resource:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(43,91,158,.13)}
.cover{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,#edf4ff,#dceaff);display:block}
.resource-body{padding:16px}
.resource h3{margin:0 0 8px;overflow-wrap:anywhere;color:#203b63}
.tag{display:inline-flex;align-items:center;border:1px solid #d7e6fb;background:#f2f7ff;padding:4px 9px;border-radius:999px;font-size:12px;color:#5d7598;font-weight:650}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:11px;padding:11px 16px;background:linear-gradient(135deg,#4c91ff,#2e70ed);color:white;font-weight:750;cursor:pointer;font-size:14px;box-shadow:0 5px 12px rgba(52,120,246,.15);transition:filter .15s,transform .15s}
button:hover,.btn:hover{filter:brightness(1.04);transform:translateY(-1px);text-decoration:none;color:white}
.secondary{background:#f1f6ff;border-color:#dbe7f7;color:#3f608e;box-shadow:none}
.secondary:hover{color:#245ec5;background:#e8f1ff}
.danger{background:#c94b5c;box-shadow:none}.good{background:#16835d;box-shadow:none}
input,textarea,select{width:100%;padding:12px 14px;background:#fbfdff;border:1px solid #d5e1f1;border-radius:11px;color:var(--text);font:inherit;margin:6px 0 15px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:#78a9ff;box-shadow:0 0 0 3px rgba(52,120,246,.12)}
input::placeholder,textarea::placeholder{color:#9aaac0}
label{font-size:14px;color:#526985;font-weight:650}
textarea{min-height:100px;resize:vertical}
form.inline{display:inline-flex;gap:6px;align-items:center;margin:0}
form.inline button{padding:8px 11px}
.notice{padding:13px 15px;border:1px solid #bfe8d7;border-radius:12px;background:#effbf5;color:#176d50;margin:12px 0}
.error{border-color:#f1c4cb;background:#fff2f3;color:#a92e43}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:#fbfdff;border:1px dashed #cbdcf1;border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{text-align:left;border-bottom:1px solid #e7eef8;padding:12px;vertical-align:top}
th{color:#7185a1;background:#f7faff;font-weight:750;white-space:nowrap}
tbody tr:hover{background:#f9fbff}
.table-wrap{overflow:auto;border-radius:12px}
.small{font-size:13px}
code{background:#eef4ff;color:#315c9f;padding:3px 6px;border-radius:6px}
.footer{padding:30px 0 18px;color:#8a9ab1;font-size:12px;text-align:center}
@media(max-width:640px){.wrap{padding:13px}header{align-items:flex-start;margin-bottom:18px}.brand{font-size:18px}nav{gap:3px}nav>a{padding:7px 8px;font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.resource-body{padding:11px}.resource h3{font-size:15px}.panel{padding:15px;border-radius:16px}h2{font-size:19px}.cover{aspect-ratio:3/2}button,.btn{padding:10px 12px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}.cover{aspect-ratio:16/9}}

/* Mobile-first polish and keyboard accessibility */
:focus-visible{outline:3px solid rgba(52,120,246,.55);outline-offset:3px}
button,.btn,nav>a{min-height:42px}
button:active,.btn:active{transform:translateY(0)}
::selection{background:#d8e8ff;color:#173a70}
img{max-width:100%}
.panel{scroll-margin-top:16px}
.resource{height:100%;display:flex;flex-direction:column}
.resource-body{display:flex;flex:1;flex-direction:column}
.resource-body>.row:last-child{margin-top:auto}
.resource-body p{overflow-wrap:anywhere}
input,textarea,select{min-width:0}
.table-wrap{-webkit-overflow-scrolling:touch}
@media(max-width:520px){
  .wrap{padding:12px}
  header{gap:12px;padding-bottom:14px}
  .brand{gap:9px}
  .logo{width:40px;height:40px;border-radius:13px}
  nav{width:100%;gap:5px}
  nav>a{padding:8px 10px}
  nav form.inline{margin-left:auto}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .resource-body{padding:12px}
  .resource h3{font-size:14px;line-height:1.45}
  .resource .row{gap:6px}
  .resource .row .btn{padding:9px 8px;font-size:12px}
  .panel{margin:12px 0}
  .empty{padding:28px 15px}
}
@media(max-width:390px){
  .grid{grid-template-columns:1fr}
  .resource .cover{aspect-ratio:16/9}
  .resource h3{font-size:16px}
  .resource .row .btn{font-size:14px;padding:10px 12px}
}


/* Personal center and admin tables on phones */
.page-heading{min-width:0;flex:1}
.page-heading p{max-width:680px}
.admin-stats .panel{padding:16px}
.admin-section-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.admin-action-form{min-width:210px}
@media(max-width:640px){
  .page-heading{width:100%}
  .page-heading h1{font-size:29px}
  .page-heading-actions{width:100%}
  .page-heading-actions .btn{flex:1}
  .admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
  .admin-stats .panel{padding:13px}
  .admin-stats .stat-value{font-size:25px!important}
  .table-wrap table{min-width:640px}
  .table-wrap th,.table-wrap td{padding:10px;font-size:13px}
  .admin-review-form input{min-width:180px}
  .admin-review-actions{display:flex;gap:8px;flex-wrap:wrap}
  .admin-review-actions button{flex:1;min-width:92px}
  .admin-section-title h2{font-size:18px}
  .admin-section-title .tag{white-space:normal}
}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head><body><div class="wrap">
<header><a class="brand" href="/"><span class="logo">✦</span><span>云端资源库<small style="display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:1.2px">CLOUD FILE CENTER</small></span></a>
<nav>
{% if user %}
<a href="/">资源首页</a><a href="/submit">提交资源</a><a href="/my-resources">个人中心</a>
{% if user.role == 'admin' %}<a href="/admin">管理后台</a>{% endif %}
<form class="inline" method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary" type="submit">退出登录</button></form>
{% else %}<a href="/login">登录</a><a href="/register">邀请码注册</a>{% endif %}
</nav></header>
{% block content %}{% endblock %}
<div class="footer">私有账号访问 · 未审核资源不会公开 · 请勿上传违法或侵权文件</div>
</div></body></html>
