{% extends "base.html" %}{% block title %}邀请码注册 · 云端资源库{% endblock %}{% block content %}
<div class="panel" style="max-width:500px;margin:28px auto;padding:clamp(20px,5vw,34px)">
<div class="tag">CREATE YOUR ACCOUNT</div><h1>创建账号</h1><p class="muted">本平台采用邀请码注册，请使用管理员发放的有效邀请码。</p>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<form method="post" action="/register"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>用户名（3–32 位）</label><input name="username" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,32}" required maxlength="32" placeholder="字母、数字、点、下划线或短横线"><label>密码（至少 10 位）</label><input name="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="设置至少 10 位密码"><label>邀请码</label><input name="invite" autocomplete="off" required maxlength="100" placeholder="输入管理员提供的邀请码"><button style="width:100%;margin-top:4px">创建账号 →</button></form>
<p class="muted small" style="text-align:center;margin-top:18px">已有账号？<a href="/login">返回登录</a></p></div>{% endblock %}
