# ClamAV daemon settings for archive uploads up to approximately 2 GiB.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 4
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
MaxQueue 100
StreamMaxLength 2200M
MaxFileSize 2200M
MaxScanSize 2500M
MaxRecursion 20
MaxFiles 20000
DatabaseDirectory /var/lib/clamav
LogTime yes
LogSyslog no
