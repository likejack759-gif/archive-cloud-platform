services:
  resource-platform:
    build: .
    container_name: cloud-resource-platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-false}
      DATA_DIR: /data
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      REQUEST_RATE_LIMIT: ${REQUEST_RATE_LIMIT:-120}
      REQUEST_RATE_WINDOW_SECONDS: ${REQUEST_RATE_WINDOW_SECONDS:-60}
    volumes:
      - ./data:/data
